services:
  medivault-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medivault-secure-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - FRONTEND_URL=http://localhost:5000
      - DATA_ENCRYPTION_KEY=WjV4ODNrc3lMbmE5M1pRYWJDZEdISktMTU5PUFFSU1Q=
      - JWT_SECRET=medivault_production_jwt_secret_key_costa_rica_2026_@#!
      - JWT_EXPIRES_IN=1h
    volumes:
      - medivault_data:/app/backend/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  medivault_data:
    driver: local
