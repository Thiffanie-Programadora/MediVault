app = "medivault-secure-vault"
primary_region = "qro"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "5000"
  JWT_EXPIRES_IN = "1h"
  LOGIN_MAX_ATTEMPTS = "5"
  LOGIN_WINDOW_MINUTES = "15"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[mounts]
  source = "medivault_data"
  destination = "/app/backend/data"
